<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast GWA Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Fast GWA Calculator</h1>
        <p class="text-gray-500 mb-6 text-sm">Upload a screenshot of your grades. We'll read it and calculate your scholarship status.</p>

        <!-- Upload Area -->
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:bg-gray-50 transition-colors mb-6 relative">
            <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div id="uploadUI">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <p class="text-sm text-gray-600 font-medium">Tap to upload portal screenshot</p>
            </div>
            <div id="loadingUI" class="hidden">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-2"></div>
                <p class="text-sm text-blue-600 font-medium">Analyzing image on server...</p>
            </div>
        </div>

        <!-- Grades Table -->
        <div class="mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-gray-700">Grades Editor</h2>
                <button onclick="addRow()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">+ Add Row</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm">
                            <th class="p-3 border-b font-medium">Grade</th>
                            <th class="p-3 border-b font-medium">Units</th>
                            <th class="p-3 border-b font-medium w-16"></th>
                        </tr>
                    </thead>
                    <tbody id="gradesTableBody">
                        <!-- Rows go here -->
                    </tbody>
                </table>
            </div>
        </div>

        <button onclick="calculateGWA()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors shadow-sm mb-6">
            Calculate My GWA
        </button>

        <!-- Results Box -->
        <div id="resultBox" class="hidden bg-green-50 border border-green-200 rounded-lg p-5 text-center">
            <p class="text-green-800 text-sm font-medium mb-1">Your General Weighted Average</p>
            <p id="gwaValue" class="text-4xl font-bold text-green-700 mb-2"></p>
            <span id="scholarStatus" class="inline-block bg-green-200 text-green-800 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider"></span>
        </div>
    </div>

    <script>
        const validGrades = [1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75, 3.00, 5.00];
        
        function createDropdown(selectedGrade) {
            let options = validGrades.map(g => `<option value="${g.toFixed(2)}" ${parseFloat(selectedGrade) === g ? 'selected' : ''}>${g.toFixed(2)}</option>`).join('');
            return `<select class="grade-input w-full p-2 border rounded bg-white text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">${options}</select>`;
        }

        function addRow(grade = '1.00', units = '3') {
            const tbody = document.getElementById('gradesTableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-2 border-b">${createDropdown(grade)}</td>
                <td class="p-2 border-b"><input type="number" value="${units}" min="1" max="10" class="unit-input w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"></td>
                <td class="p-2 border-b text-center"><button onclick="this.closest('tr').remove()" class="text-red-400 hover:text-red-600 font-bold text-xl">&times;</button></td>
            `;
            tbody.appendChild(tr);
        }

        document.getElementById('imageInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('uploadUI').classList.add('hidden');
            document.getElementById('loadingUI').classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Point this to your backend URL when deployed (e.g., https://your-render-app.com/extract-grades)
                const response = await fetch('http://localhost:8000/extract-grades', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.data && result.data.length > 0) {
                    document.getElementById('gradesTableBody').innerHTML = ''; // Clear table
                    result.data.forEach(item => addRow(item.grade, item.units));
                } else {
                    alert("Could not detect any clear grades. Please add them manually.");
                }
            } catch (error) {
                alert("Server error. Make sure the Python backend is running.");
            } finally {
                document.getElementById('loadingUI').classList.add('hidden');
                document.getElementById('uploadUI').classList.remove('hidden');
                e.target.value = ''; // Reset input
            }
        });

        function calculateGWA() {
            let totalGradeUnits = 0;
            let totalUnits = 0;
            const rows = document.querySelectorAll('#gradesTableBody tr');

            rows.forEach(row => {
                const grade = parseFloat(row.querySelector('.grade-input').value);
                const units = parseFloat(row.querySelector('.unit-input').value);
                if (!isNaN(grade) && !isNaN(units)) {
                    totalGradeUnits += (grade * units);
                    totalUnits += units;
                }
            });

            if (totalUnits === 0) return alert("Please add at least one valid grade and unit.");

            const gwa = (totalGradeUnits / totalUnits).toFixed(4);
            let status = "No Scholarship Status";

            if (gwa >= 1.00 && gwa <= 1.50) status = "University Scholar";
            else if (gwa >= 1.51 && gwa <= 1.75) status = "College Scholar";
            else if (gwa >= 1.76 && gwa <= 2.00) status = "Dean's Lister";

            document.getElementById('gwaValue').innerText = gwa;
            document.getElementById('scholarStatus').innerText = status;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        // Initialize with one empty row
        addRow();
    </script>
</body>
</html>
